name: Build site
description: Install the project toolchain, restore build caches, and validate the static site.

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      with:
        version: 2026.10.2
    - name: Locate pnpm store
      id: pnpm-store
      shell: bash
      run: printf 'path=%s\n' "$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - name: Cache dependencies
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('mise.toml', 'pnpm-lock.yaml') }}
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Cache processed images
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: node_modules/.astro
        key: ${{ runner.os }}-${{ runner.arch }}-astro-images-${{ hashFiles('mise.toml', 'pnpm-lock.yaml', 'astro.config.mjs', 'src/assets/**', 'src/components/**', 'src/layouts/**') }}
    - name: Check types
      shell: bash
      run: pnpm run check
    - name: Run tests
      shell: bash
      run: pnpm test
    - name: Build static pages
      shell: bash
      run: pnpm build
